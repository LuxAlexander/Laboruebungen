{% extends 'core/base.html' %}
{% block title %}Log in · FC ITS Ticketing{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Log in</h1>
        <form method="post">
          {% csrf_token %}
          {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>{% endif %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <input class="form-control" type="text" name="username" id="id_username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Password</label>
            <input class="form-control" type="password" name="password" id="id_password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Log in</button>
        </form>
        <p class="small text-body-secondary mt-3 mb-0">
          No account yet? <a href="{% url 'customers:register' %}?next={{ next|urlencode }}">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
